# HV Backup Orchestrator configuration.
# Copy to config/config.yaml and edit. Restart the container after changes.
#
# Layout: every section in this file sits at the top level (no indentation) and applies
# globally, to every cloud and every job the app manages. Nothing is nested under a cloud.
# The only per-cloud settings are the *_repositories maps and include/exclude_clouds below,
# which take a cloud name or, better, its SCVMM ID.
#
# Secrets never go here. Passwords come from .env:
#   VBR_PASSWORD, SCVMM_PASSWORD, SMTP_PASSWORD (and optionally VBR_USERNAME, SCVMM_USERNAME,
#   SMTP_USERNAME, VBR_CERT_THUMBPRINT, SCVMM_CERT_THUMBPRINT)

# ================================================================ general
mock: false                      # true = built-in demo estate; nothing remote is touched
data_dir: /data                  # run history and state (the hvbo-data Docker volume)
sync_interval_minutes: 60        # how often SCVMM and VBR are checked
auto_apply: false                # start in plan-only mode; turn on in the UI once happy (the UI toggle wins)
include_stopped_vms: true        # back up powered-off VMs too

# any_hyperv_job: a VM already in ANY Hyper-V job (including hand-built ones) counts as backed up.
# managed_only:   every cloud VM also goes into this app's own jobs.
coverage_mode: any_hyperv_job

# ================================================================ retention
# Each VM's retention is the whole number of days in its SCVMM custom property (e.g. 7, 45, 180, 400).
# Blank, missing or anything that is not a whole number above 0: default_retention_days.
default_retention_days: 30

classification:
  custom_property: BackupTier    # create once in SCVMM: New-SCCustomProperty -Name BackupTier -AddMember @("VM")

retier:                          # when a VM's retention number changes
  auto_upgrade: true             # raised: move the VM and its restore points to the longer job (created if needed)
  auto_downgrade: false          # lowered: shortens how long backups are kept, so it waits for approval
  auto_cross_cloud: false        # VM moved to another SCVMM cloud: wait for approval
  remap_backups: true            # move existing restore points with the VM (Move-VBRBackup; per-machine backup files)

# ================================================================ remote hosts (PowerShell remoting over WinRM)
scvmm:
  host: scvmm01.arc.local        # server with the VMM console/module, usually the VMM server itself
  vmm_server_name: localhost     # name passed to Get-SCVMMServer on that host
  username: null                 # or SCVMM_USERNAME in .env, e.g. ARCHOSTED\svc-hvbo; password: SCVMM_PASSWORD
  port: null                     # null = 5986 with ssl, 5985 without
  ssl: true                      # HTTPS listener on the server (recommended)
  auth: ntlm                     # ntlm | negotiate | kerberos (build with KERBEROS=1) | credssp
  cert_validation: true          # check the WinRM certificate against a CA...
  ca_bundle: null                # ...e.g. /config/arc-root-ca.pem, mounted into /config
  cert_thumbprint: null          # ...or pin one certificate by thumbprint (self-signed is fine; host/IP need not match)
  configuration_name: Microsoft.PowerShell   # VMM's module needs Windows PowerShell 5.1
  pwsh_bridge: false             # SCVMM does not need PowerShell 7
  pwsh_path: null
  server_name: null              # VBR only; ignored here
  accept_local_tls_certificate: true   # VBR only; ignored here
  operation_timeout: 600

vbr:
  host: vbr01.arc.local          # Windows VBR 13.1 server (an IP address is fine when cert_thumbprint is set)
  username: null                 # or VBR_USERNAME in .env; workgroup server = local account, e.g. VBR01\svc-hvbo
  port: null
  ssl: true
  auth: ntlm
  cert_validation: true
  ca_bundle: null
  # Read it on the server: Get-ChildItem WSMan:\localhost\Listener\*\CertificateThumbprint
  cert_thumbprint: null          # e.g. "D1CD2DE286756D1F3C83594F5FA5B0930ACB0479" (or VBR_CERT_THUMBPRINT in .env)
  # VBR 13.x's PowerShell module needs PowerShell 7.6. The bridge connects to the built-in 5.1 endpoint
  # and runs each script in pwsh.exe, so no PowerShell 7 remoting endpoint is needed.
  configuration_name: Microsoft.PowerShell
  pwsh_bridge: true
  pwsh_path: 'C:\Program Files\PowerShell\7\pwsh.exe'   # falls back to pwsh.exe on PATH
  # Connect-VBRServer runs on the VBR server against itself, over TLS. A non-interactive session cannot
  # answer "trust this certificate?", so the local certificate is accepted. It never leaves the server.
  server_name: null              # null = the server's own computer name
  accept_local_tls_certificate: true
  operation_timeout: 900

# ================================================================ jobs and repositories
job_name_template: "HVBO {cloud} {tier_label}"   # e.g. "HVBO Murrays Hall 30d". Tokens: {cloud} {tier_label} {retention}
job_name_max_length: 50
template_job: null               # existing VBR job to copy advanced/VSS options from (encryption is always applied after)

default_repository: "SOBR-Tenants"       # backup jobs go here unless one of the maps below matches
retention_repositories: {}               # by retention days, e.g. {365: "SOBR-LongTerm"}
cloud_repositories: {}                   # by cloud ID or name, e.g. {"8f1c...": "SOBR-Acme"}
cloud_tier_repositories: {}              # by cloud and retention, e.g. {"8f1c...": {365: "SOBR-Acme-LTR"}}
# Precedence: cloud_tier_repositories > cloud_repositories > retention_repositories > default_repository

include_clouds: []               # cloud IDs or names; empty = all clouds
exclude_clouds: []               # cloud IDs or names, e.g. ["Infrastructure"]
# Use cloud IDs where you can, so a renamed cloud keeps its settings: (Get-SCCloud -Name "Acme Legal").ID
rename_jobs_on_cloud_rename: approve     # approve | auto | off: rename this app's jobs when their cloud is renamed

# ================================================================ backup copy jobs (one per backup job)
backup_copy:
  enabled: true
  target_repository: "SOBR-Copy-7d"      # separate repository or SOBR; must differ from the backup job's
  cloud_repositories: {}                 # per cloud ID or name, e.g. {"8f1c...": "SOBR-Acme-Copy"}
  retention_days: 7
  mode: Immediate                        # Immediate (copies each new restore point) | Periodic
  name_template: "{job} Copy"            # tokens: {job} {cloud} {tier} {tier_label}
  compression: Auto                      # Auto | None | DedupeFriendly | Optimal | High | Extreme
  storage_optimization: LocalTarget      # LocalTarget | LocalTargetHugeBackup | LANTarget | WANTarget | Automatic

# ================================================================ encryption (all backup AND copy jobs)
encryption:
  enabled: true
  key_description: ITGlue        # description of the key in VBR's key vault (Password Manager), matched exactly.
                                 # Missing or not unique: no job is created or changed until it is fixed.

# ================================================================ weekly GFS + synthetic fulls (all backup AND copy jobs)
gfs:
  enabled: true                  # "Keep certain full backups longer for archival purposes", weekly
  weekly_keep_weeks: 1           # "Keep weekly full backups for N weeks"
  days: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]   # days the app spreads jobs across
  copy_jobs: true                # copy jobs too, on the same day as their source job

# ================================================================ start times
schedule:
  window_start: "18:00"
  window_end: "00:00"            # 120 start slots at a 3-minute stagger
  stagger_minutes: 3
  avoid_unmanaged_job_times: true   # keep clear of hand-built Hyper-V jobs' start times
  order: first_free              # rebalance order: first_free (by cloud name) | longest_first

safety:
  reserve_foreign_job_times: true   # keep clear of VMware, Nutanix and other jobs' start times

# ================================================================ deleted VMs
cleanup:
  deleted_vms: approve           # approve | auto | off: remove VMs that no longer exist anywhere in SCVMM from this app's jobs
  max_per_run: 20                # more than this at once looks like an inventory problem, so it is blocked

# ================================================================ email alerts
email:
  enabled: false
  host: smtp.arc.local
  port: 587
  security: starttls             # starttls | ssl (usually port 465) | none
  username: null                 # or SMTP_USERNAME in .env; password: SMTP_PASSWORD in .env
  sender: hvbo@arcsystems.co.uk
  to: [backups@arcsystems.co.uk]
  subject_prefix: "[HVBO]"
  app_url: null                  # e.g. https://hvbo.arc.local, for links in emails
  on_change: true                # jobs created or changed (and failures while applying)
  on_attention: true             # actions waiting for approval or blocked
  on_failure: true               # a run failed, e.g. SCVMM or VBR unreachable
  reminder_hours: 24             # repeat an unchanged attention/failure alert after this long; 0 = never
  timeout: 30                    # seconds to wait for the SMTP server
